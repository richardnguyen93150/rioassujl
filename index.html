<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIO ASSURANCE — Remplissage JLAssure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --orange: #E8460A;
    --orange-light: #FF6B35;
    --dark: #111111;
    --mid: #1E1E1E;
    --surface: #252525;
    --border: #333333;
    --text: #F0EDE8;
    --muted: #888;
    --green: #2ECC71;
    --yellow: #F1C40F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--mid);
    border-bottom: 2px solid var(--orange);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    width: 36px; height: 36px;
    background: var(--orange);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; color: white;
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; }
  .header span { color: var(--orange); }
  .header-badge {
    margin-left: auto;
    background: var(--orange);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* LAYOUT */
  .app { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 70px); }

  /* MOBILE RESPONSIVE */
  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    .header { padding: 10px 14px; }
    .header h1 { font-size: 13px; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); padding: 14px; max-height: 50vh; overflow-y: auto; }
    .main { padding: 14px; }
    .section-body, .section-body.triple { grid-template-columns: 1fr !important; }
    .form-header { flex-direction: column; gap: 10px; align-items: stretch; }
    .form-header > div:last-child { display: flex; flex-wrap: wrap; gap: 8px; }
    .form-header > div:last-child a,
    .form-header > div:last-child button { flex: 1; min-width: 120px; font-size: 12px !important; padding: 10px 10px !important; text-align: center; justify-content: center; }
    .form-client-name { font-size: 20px; }
    #modal-script > div, #modal-iphone > div { width: 96% !important; padding: 16px !important; max-height: 90vh; }
    .btn-fill { font-size: 13px; padding: 10px 14px; }
    .field-value { font-size: 12px; }
    .section-header { font-size: 11px; }
    .no-selection { padding: 30px 16px; }
    .steps { display: none; }
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--mid);
    border-right: 1px solid var(--border);
    padding: 24px;
    overflow-y: auto;
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* SEARCH */
  .search-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--orange); }
  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    width: 100%;
  }
  .search-box input::placeholder { color: var(--muted); }

  /* CLIENT CARD */
  .client-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .client-card:hover { border-color: var(--orange); transform: translateX(3px); }
  .client-card.selected { border-color: var(--orange); background: rgba(232, 70, 10, 0.08); }
  .client-card.filled { border-color: var(--green); }

  .client-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .client-meta {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .client-immat {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--orange-light);
    margin-top: 6px;
    display: inline-block;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--yellow);
    position: absolute;
    top: 14px; right: 14px;
  }
  .status-dot.done { background: var(--green); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 40px 0;
  }

  /* MAIN */
  .main { padding: 32px; overflow-y: auto; }

  .no-selection {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    text-align: center;
    gap: 16px;
  }
  .no-selection .icon { font-size: 64px; opacity: 0.3; }
  .no-selection p { font-size: 16px; max-width: 300px; line-height: 1.5; }

  /* FORM PANEL */
  .form-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .form-client-name { font-size: 28px; font-weight: 800; }
  .form-client-sub {
    font-size: 13px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 4px;
  }

  .btn-fill {
    background: var(--orange);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .btn-fill:hover { background: var(--orange-light); transform: translateY(-1px); }
  .btn-fill:active { transform: translateY(0); }
  .btn-fill:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* SECTIONS */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .section-header {
    padding: 14px 18px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--orange-light);
  }
  .section-body {
    padding: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .section-body.single { grid-template-columns: 1fr; }
  .section-body.triple { grid-template-columns: 1fr 1fr 1fr; }

  /* FIELD */
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field-value {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--text);
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
  }
  .field-value.missing {
    color: var(--muted);
    font-style: italic;
    border-color: #2a2a2a;
  }
  .field-value.orange { color: var(--orange-light); }

  /* CHAMPS MODIFIABLES */
  .field input, .field select {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--text);
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .field input:focus, .field select:focus { border-color: var(--orange); }
  .field select option { background: var(--dark); }

  /* RADIO GROUP */
  .radio-group { display: flex; gap: 12px; align-items: center; padding: 8px 0; }
  .radio-group label {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: normal;
    text-transform: none; letter-spacing: 0;
    color: var(--text); cursor: pointer;
  }
  .radio-group input[type=radio] { accent-color: var(--orange); width: 16px; height: 16px; }

  /* STATUS */
  .fill-status {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    font-weight: 600;
  }
  .fill-status.idle { background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--muted); }
  .fill-status.loading { background: rgba(232, 70, 10, 0.1); border: 1px solid var(--orange); color: var(--orange-light); }
  .fill-status.success { background: rgba(46, 204, 113, 0.1); border: 1px solid var(--green); color: var(--green); }
  .fill-status.error { background: rgba(231, 76, 60, 0.1); border: 1px solid #E74C3C; color: #E74C3C; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* PROGRESS STEPS */
  .steps {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .step {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 600;
    transition: all 0.3s;
  }
  .step.active { border-color: var(--orange); color: var(--orange-light); background: rgba(232,70,10,0.1); }
  .step.done { border-color: var(--green); color: var(--green); background: rgba(46,204,113,0.08); }

  /* LOAD SHEET BUTTON */
  .btn-load {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    margin-bottom: 16px;
    width: 100%;
    justify-content: center;
  }
  .btn-load:hover { border-color: var(--orange); color: var(--orange-light); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  /* MANUAL INPUT */
  .manual-input-area {
    margin-top: 16px;
  }
  .manual-input-area textarea {
    width: 100%;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 12px;
    resize: vertical;
    min-height: 80px;
    outline: none;
    margin-bottom: 8px;
  }
  .manual-input-area textarea:focus { border-color: var(--orange); }
  .manual-input-area .btn-parse {
    background: var(--surface);
    border: 1px solid var(--orange);
    color: var(--orange-light);
    padding: 8px 16px;
    border-radius: 6px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: all 0.2s;
  }
  .manual-input-area .btn-parse:hover { background: rgba(232,70,10,0.1); }

  /* SCROLL */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">R</div>
  <button onclick="traiterEmails()" id="btn-emails"
    style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;">
    <span>📧</span> <span id="emails-label">EMAILS</span>
  </button>
  <h1>RIO <span>ASSURANCE</span> — JLAssure Auto-Fill</h1>
  <div class="header-badge">JL Assure</div>
</div>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-title">📋 Clients du Sheet</div>

    <!-- CONFIG -->
    <div id="cfg-panel" style="display:none; margin-bottom:12px;">
      <div style="font-size:11px; color:var(--muted); font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:8px;">⚙️ Configuration</div>
      <input id="input-apikey" type="text" placeholder="Clé API Google (AIzaSy...)"
        style="width:100%;background:var(--dark);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:8px;margin-bottom:6px;outline:none;">
      <button onclick="saveConfig()" style="width:100%;background:var(--orange);color:white;border:none;padding:8px;border-radius:6px;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;cursor:pointer;">Sauvegarder</button>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="btn-load" onclick="syncSheet()" id="btn-sync" style="flex:1;margin-bottom:0;">
        <span>🔄</span> <span id="sync-label">Charger le Sheet</span>
      </button>
      <button onclick="toggleConfig()" style="background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:10px 12px;border-radius:8px;cursor:pointer;font-size:16px;" title="Configuration">⚙️</button>
    </div>

    <div class="search-box">
      <span style="color:var(--muted)">🔍</span>
      <input type="text" placeholder="Rechercher un client..." oninput="filterClients(this.value)" id="search-input">
    </div>

    <div id="clients-list">
      <div class="empty-state">
        Clique sur "Charger" pour<br>récupérer les clients du Sheet
      </div>
    </div>

    <div class="divider"></div>
    <div class="sidebar-title">✏️ Saisie manuelle</div>
    <div class="manual-input-area">
      <textarea id="manual-json" placeholder='{"Prenom":"Jean","Nom":"Dupont","Immatriculation":"AB-123-CD","Telephone":"0601020304","Email":"jean@mail.com","DateNaissance":"15/03/1985","DatePermisB":"10/06/2005","NumeroPermis":"051133200663","Marque":"PEUGEOT","Modele":"308","PuissanceFiscale":"7","DateMiseEnCirculation":"15/03/2018","NumeroSerie":"VF3LBBHZ6GS123456","Rue":"12 Rue de la Paix","CodePostal":"75001","Ville":"Paris"}'></textarea>
      <button class="btn-parse" onclick="parseManual()">📥 Charger ce client</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main-panel">
    <div class="no-selection">
      <div class="icon">🚗</div>
      <p>Sélectionne un client pour préparer le remplissage du formulaire JLAssure</p>
    </div>
  </div>
</div>

<script>
// ============================================================
// DONNÉES
// ============================================================
// SHEET_ID défini dans la section CONFIG ci-dessous

let clients = [];
let selectedClient = null;
let filledClients = new Set();

// ============================================================
// CONFIG
// ============================================================
const SHEET_ID = '1OwSWHZyu2VeFA0mCZ-KWwJslBguRzecFA45yhq3uEtU';
const MAIL_SYNC_URL = 'https://rioassu.fr/api_direct/mail-sync/fg9-LV2Djpcf_NI_ZjqpdrCdz3eVS61QFRRFJjjCcGs';
let gApiKey = localStorage.getItem('jl_gApiKey') || '';

function toggleConfig() {
  const p = document.getElementById('cfg-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  if (p.style.display === 'block') {
    document.getElementById('input-apikey').value = gApiKey;
  }
}

function saveConfig() {
  gApiKey = document.getElementById('input-apikey').value.trim();
  localStorage.setItem('jl_gApiKey', gApiKey);
  document.getElementById('cfg-panel').style.display = 'none';
  showToast('✅ Clé API sauvegardée');
  if (gApiKey) syncSheet();
}

function showToast(msg) {
  let t = document.getElementById('toast-msg');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-msg';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:999;transition:opacity 0.3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2500);
}

// ============================================================
// TRAITEMENT DES MAILS — déclenche mail_processor.py sur O2Switch
// ============================================================
async function traiterEmails() {
  const btn = document.getElementById('btn-emails');
  const label = document.getElementById('emails-label');
  btn.disabled = true;
  label.textContent = 'Traitement...';
  try {
    await fetch(MAIL_SYNC_URL, {method:'GET', mode:'no-cors'});
    showToast('✅ Traitement lancé ! Sheet mis à jour dans 15s');
    setTimeout(syncSheet, 15000);
  } catch(e) {
    showToast('❌ ' + e.message);
    console.error(e);
  } finally {
    setTimeout(() => { label.textContent = 'Traiter les emails'; btn.disabled = false; }, 3000);
  }
}

// ============================================================
// CHARGEMENT SHEET — Google Sheets API v4
// ============================================================
async function syncSheet() {
  if (!gApiKey) {
    document.getElementById('cfg-panel').style.display = 'block';
    document.getElementById('input-apikey').focus();
    showToast('⚙️ Entre ta clé API Google d\'abord');
    return;
  }

  const btn = document.getElementById('btn-sync');
  const label = document.getElementById('sync-label');
  btn.disabled = true;
  label.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:6px;"></div> Chargement...';

  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Clients?key=${gApiKey}`;
    const resp = await fetch(url);
    const data = await resp.json();

    if (data.error) throw new Error(data.error.message);
    if (!data.values || data.values.length < 2) {
      renderClients([]);
      showToast('ℹ️ Aucun client dans le Sheet');
      return;
    }

    const headers = data.values[0];
    clients = data.values.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = row[i] || ''; });
      return obj;
    }).filter(c => c.Prenom && c.Prenom !== '').reverse();

    renderClients(clients);
    label.textContent = `✅ ${clients.length} clients`;
    btn.style.borderColor = 'var(--green)';
    btn.style.color = 'var(--green)';
    showToast(`✅ ${clients.length} clients chargés`);
  } catch(e) {
    label.textContent = '❌ Erreur';
    btn.style.color = '#E74C3C';
    showToast('❌ ' + e.message);
    console.error(e);
  }
  btn.disabled = false;
}

function filterClients(query) {
  const filtered = query
    ? clients.filter(c => `${c.Prenom} ${c.Nom} ${c.Immatriculation}`.toLowerCase().includes(query.toLowerCase()))
    : clients;
  renderClients(filtered);
}

function renderClients(list) {
  const container = document.getElementById('clients-list');
  if (!list.length) {
    container.innerHTML = '<div class="empty-state">Aucun client trouvé</div>';
    return;
  }
  container.innerHTML = list.map((c, i) => `
    <div class="client-card ${selectedClient === c ? 'selected' : ''} ${filledClients.has(c.EmailId) ? 'filled' : ''}"
         onclick="selectClient(${clients.indexOf(c)})">
      <div class="status-dot ${filledClients.has(c.EmailId) ? 'done' : ''}"></div>
      <div class="client-name">${c.Prenom || ''} ${c.Nom || ''}</div>
      <div class="client-meta">
        <span>${c.DateEffet || ''}</span>
        <span>${c.Ville || ''}</span>
      </div>
      ${c.Immatriculation && c.Immatriculation !== 'NON TROUVE' ? `<div class="client-immat">${c.Immatriculation}</div>` : ''}
    </div>
  `).join('');
}

function selectClient(idx) {
  selectedClient = clients[idx];
  renderForm(selectedClient);
  renderClients(clients);
}

function parseManual() {
  try {
    const txt = document.getElementById('manual-json').value.trim();
    const obj = JSON.parse(txt);
    clients.unshift(obj);
    selectClient(0);
    renderClients(clients);
  } catch(e) {
    alert('JSON invalide. Vérifie le format.');
  }
}

// ============================================================
// AFFICHAGE FORMULAIRE
// ============================================================
function renderForm(c) {
  const main = document.getElementById('main-panel');

  // Préparer les valeurs avec fallbacks
  const nomComplet = `${c.Prenom || ''} ${c.Nom || ''}`.trim();
  const tel = addZero((c.Telephone || '').replace(/\s/g,''));
  const mobile = addZero((c.Telephone || '').replace(/\s/g,''));

  main.innerHTML = `
    <div class="form-header">
      <div>
        <div class="form-client-name">${nomComplet}</div>
        <div class="form-client-sub">
          ${c.Email || ''} &nbsp;·&nbsp; ${c.DateEffet ? 'Effet: ' + c.DateEffet : ''}
        </div>
      </div>

// ============================================================
// GÉNÉRATION DU SCRIPT CONSOLE — méthode Simplificateur
// ============================================================
function buildScript() {
  if (!selectedClient) return '';
  const c = selectedClient;

  const data = {
    nom:          c.Nom || '',
    prenom:       c.Prenom || '',
    adresse:      c.Rue || '',
    codePostal:   c.CodePostal || '',
    ville:        c.Ville || '',
    marque:       c.Marque && c.Marque !== 'NON TROUVE' ? c.Marque : '',
    modele:       c.Modele && c.Modele !== 'NON TROUVE' ? c.Modele : '',
    puissance:    c.PuissanceFiscale && c.PuissanceFiscale !== 'NON TROUVE' ? c.PuissanceFiscale : '',
    dateMEC:      formatDateJL(c.DateMiseEnCirculation),
    numeroSerie:  c.NumeroSerie && c.NumeroSerie !== 'NON TROUVE' ? c.NumeroSerie : '',
    immat:        c.Immatriculation && c.Immatriculation !== 'NON TROUVE' ? c.Immatriculation : '',
    dateNaissance:formatDateJL(c.DateNaissance),
    datePermisB:  formatDateJL(c.DatePermisB),
    numeroPermis: c.NumeroPermis && c.NumeroPermis !== 'NON TROUVE' ? c.NumeroPermis : '',
    typePermis:   document.getElementById('f-type-permis')?.value || 'B',
    categorie:    document.getElementById('f-categorie')?.value || 'VP',
    poids:        document.getElementById('f-poids')?.value || (c.PoidsG1 && c.PoidsG1 !== 'NON TROUVE' ? c.PoidsG1 : ''),
    places:       document.getElementById('f-places')?.value || '5',
    valeur:       document.getElementById('f-valeur')?.value || '',
    location:     document.getElementById('f-location')?.value || 'NON',
    cgBarre:      document.querySelector('input[name="cg-barre"]:checked')?.value || 'NON',
    motif:        document.getElementById('f-motif')?.value || 'achat_vente',
    dateEffet:    document.getElementById('f-date-effet')?.value || '',
    heure:        document.getElementById('f-heure')?.value || getCurrentTime(),
    telFixe:      addZero(document.getElementById('f-tel-fixe')?.value || ''),
    mobile:       addZero(document.getElementById('f-mobile')?.value || ''),
    email:        document.getElementById('f-email')?.value || ''
  };

  return `(function(){
  var d = ${JSON.stringify(data)};

  function sv(id, val) {
    var el = document.getElementById(id);
    if (!el || val === '' || val === undefined) return;
    el.value = val;
    el.dispatchEvent(new Event('change',{bubbles:true}));
    el.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function svn(name, val) {
    var el = document.querySelector('[name="'+name+'"]');
    if (!el || val === '' || val === undefined) return;
    el.value = val;
    el.dispatchEvent(new Event('change',{bubbles:true}));
    el.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function sr(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.checked = true;
    el.dispatchEvent(new Event('change',{bubbles:true}));
  }

  // --- Antécédents : tous NON ---
  sr('choix_2'); sr('choix_4'); sr('choix_6'); sr('choix_8');
  sr('choix_pologne_non');

  // --- Motif ---
  sv('motif_assurance_temporaire', d.motif);

  // --- Infos conducteur ---
  sv('nom_client',    d.nom);
  sv('prenom_client', d.prenom);
  sv('naissance',     d.dateNaissance);
  sv('adresse1',      d.adresse);
  sv('code_postal',   d.codePostal);
  sv('ville',         d.ville);
  svn('pays_residence', 'FRANCE METROPOLITAINE');

  // --- Permis ---
  sv('num_permis',       d.numeroPermis);
  sv('date_permis',      d.datePermisB);
  svn('type_permis',     d.typePermis);

  // --- Véhicule ---
  sv('immatriculation',  d.immat);
  sv('marque',           d.marque);
  sv('modele',           d.modele);
  sv('puissance',        d.puissance);
  sv('chassis',          d.numeroSerie);
  sv('mise_circulation', d.dateMEC);
  sv('ptc',              d.poids);
  sv('place',            d.places);
  sv('valeur_argus',     d.valeur);
  sv('categorie',        d.categorie);
  svn('vehi_location',   d.location);

  // --- Carte grise barrée ---
  if (d.cgBarre === 'OUI') sr('choix_cg_oui');
  else sr('choix_cg_non');

  // --- Assurance ---
  sv('date_effet',  d.dateEffet);
  sv('heure_effet', d.heure);
  sv('choix-location', d.location);

  // --- Contact ---
  sv('telephone_client', d.telFixe);
  sv('gsm_client',       d.mobile);
  sv('mail_client',      d.email);

  console.log('%c✅ RIO ASSURANCE — Formulaire JLAssure rempli !', 'color:#2ecc71;font-weight:bold;font-size:14px;');
})();`;
}

  document.getElementById('btn-tab-remplir').style.borderColor= id === 'tab-remplir' ? 'var(--orange)'         : 'var(--border)';
  document.getElementById('btn-tab-stay').style.background    = id === 'tab-stay'    ? 'rgba(232,70,10,0.15)' : 'var(--surface)';
  document.getElementById('btn-tab-stay').style.color         = id === 'tab-stay'    ? 'var(--orange-light)'   : 'var(--muted)';
  document.getElementById('btn-tab-stay').style.borderColor   = id === 'tab-stay'    ? 'var(--orange)'         : 'var(--border)';
}

function buildJLUrl() {
  if (!selectedClient) return '';
  const c = selectedClient;
  const data = {
    n:  c.Nom || '',
    p:  c.Prenom || '',
    r:  c.Rue || '',
    cp: c.CodePostal || '',
    v:  c.Ville || '',
    mk: c.Marque && c.Marque !== 'NON TROUVE' ? c.Marque : '',
    md: c.Modele && c.Modele !== 'NON TROUVE' ? c.Modele : '',
    cv: c.PuissanceFiscale && c.PuissanceFiscale !== 'NON TROUVE' ? c.PuissanceFiscale : '',
    mc: formatDateJL(c.DateMiseEnCirculation),
    vin:c.NumeroSerie && c.NumeroSerie !== 'NON TROUVE' ? c.NumeroSerie : '',
    i:  c.Immatriculation && c.Immatriculation !== 'NON TROUVE' ? c.Immatriculation : '',
    dn: formatDateJL(c.DateNaissance),
    dp: formatDateJL(c.DatePermisB),
    np: c.NumeroPermis && c.NumeroPermis !== 'NON TROUVE' ? c.NumeroPermis : '',
    t:  addZero(c.Telephone || ''),
    m:  addZero(c.Telephone || ''),
    e:  c.Email || '',
    de: formatDateJL(c.DateEffet),
    po: c.PoidsG1 && c.PoidsG1 !== 'NON TROUVE' ? c.PoidsG1 : ''
  };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  return 'https://www.jlassure.com/sousfiche/gestion_app/index.php?view=Souscription#jl=' + encoded;
}

function openJLAssureIphone() {
  const url = buildJLUrl();
  if (!url) return;
  // Afficher l'URL pour debug
  const preview = document.getElementById('iphone-url-preview');
  preview.textContent = url;
  preview.style.display = 'block';
  window.open(url, '_blank');
}

// Script Stay — lu au chargement de la page JLAssure, décode #jl= et remplit
function buildStayScript() {
  return `// ==UserScript==
// @name         JL ASSURE — RIO ASSURANCE
// @namespace    rioassurance
// @version      3.0
// @description  Remplissage automatique formulaire JLAssure
// @match        https://www.jlassure.com/*
// @run-at       document-end
// ==/UserScript==

(function(){

  // Lire les données depuis #jl=
  var hash = window.location.hash;
  var d = null;
  if (hash && hash.indexOf('#jl=') >= 0) {
    try { d = JSON.parse(decodeURIComponent(escape(atob(hash.replace('#jl=',''))))); } catch(e) {}
  }

  // ── Helpers ──────────────────────────────────────────────
  function sv(id, val) {
    var el = document.getElementById(id);
    if (!el || !val) return;
    el.value = val;
    el.dispatchEvent(new Event('change',{bubbles:true}));
    el.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function svn(name, val) {
    var el = document.querySelector('[name="'+name+'"]');
    if (!el || !val) return;
    el.value = val;
    el.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function cliquerNON() {
    ['choix_2','choix_4','choix_6','choix_8','choix_pologne_non'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) { el.checked = true; el.click(); el.dispatchEvent(new Event('change',{bubbles:true})); }
    });
    document.querySelectorAll('label, span, div').forEach(function(el) {
      if (el.childElementCount === 0 && el.textContent.trim() === 'Non') {
        el.click();
      }
    });
    document.querySelectorAll('input[type=radio]').forEach(function(r) {
      var val = (r.value||'').toLowerCase();
      if (val === 'non' || val === '0' || val === 'false' || val === 'no') {
        r.checked = true;
        r.click();
        r.dispatchEvent(new Event('change',{bubbles:true}));
      }
    });
  }

  function cliquerBouton(id) {
    var el = document.getElementById(id);
    if (!el) return false;
    var s = window.getComputedStyle(el);
    var p = el.parentElement;
    var ps = p ? window.getComputedStyle(p) : null;
    if (s.visibility === 'hidden' || s.display === 'none') return false;
    if (ps && ps.visibility === 'hidden') return false;
    el.click();
    return true;
  }

  // ── Étape 1 : sélectionner VL et cliquer J'AI COMPRIS ───
  function etape1() {
    var sel = document.querySelector('select');
    if (sel) {
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].text.indexOf('VL') >= 0 || sel.options[i].text.indexOf('Camping') >= 0) {
          sel.selectedIndex = i;
          sel.dispatchEvent(new Event('change',{bubbles:true}));
          break;
        }
      }
    }
    var tries = 0;
    var t = setInterval(function() {
      tries++;
      if (cliquerBouton('madiv_compris') || cliquerBouton('madiv_compris_2') || cliquerBouton('madiv_compris_3')) {
        clearInterval(t);
        setTimeout(etape2, 1000);
      }
      if (tries > 20) { clearInterval(t); ajouterBoutonFlottant(); }
    }, 300);
  }

  // ── Étape 2 : 5 questions NON ────────────────────────────
  var questionActuelle = 0;

  function etape2() {
    questionActuelle = 0;
    repondreQuestion();
  }

  function repondreQuestion() {
    cliquerNON();
    setTimeout(function() {
      questionActuelle++;
      if (questionActuelle < 5) {
        if (cliquerBouton('madiv')) {
          setTimeout(repondreQuestion, 800);
        } else {
          setTimeout(etape3, 800);
        }
      } else {
        // 5 questions répondues — attendre choix motif par l'utilisateur
        ajouterBoutonFlottant();
      }
    }, 400);
  }

  // ── Étape 3 : remplir le formulaire ─────────────────────
  function etape3() {
    if (d) {
      sv('nom_client',       d.n);
      sv('prenom_client',    d.p);
      sv('naissance',        d.dn);
      sv('adresse1',         d.r);
      sv('code_postal',      d.cp);
      sv('ville',            d.v);
      svn('pays_residence',  'FRANCE METROPOLITAINE');
      sv('num_permis',       d.np);
      sv('date_permis',      d.dp);
      sv('immatriculation',  d.i);
      sv('marque',           d.mk);
      sv('modele',           d.md);
      sv('puissance',        d.cv);
      sv('chassis',          d.vin);
      sv('mise_circulation', d.mc);
      sv('ptc',              d.po);
      sv('place',            '5');
      sv('date_effet',       d.de);
      sv('telephone_client', d.t);
      sv('gsm_client',       d.m);
      sv('mail_client',      d.e);
    }
    ajouterBoutonFlottant();
    mettreAJourLibelle();
  }

  // ── Bouton flottant ──────────────────────────────────────
  function mettreAJourLibelle() {
    var btn = document.getElementById('rio-btn');
    if (!btn) return;
    function vis(id) {
      var el = document.getElementById(id); if (!el) return false;
      var s = window.getComputedStyle(el); if (s.visibility==='hidden'||s.display==='none') return false;
      var p = el.parentElement; if (p && window.getComputedStyle(p).visibility==='hidden') return false;
      return true;
    }
    if (vis('madiv_compris')||vis('madiv_compris_2')||vis('madiv_compris_3')) {
      btn.textContent = "J'AI COMPRIS";
    } else if (vis('madiv')) {
      btn.textContent = 'SUIVANT';
    } else if (vis('envoyer3')) {
      btn.textContent = 'CONTINUER';
    } else {
      btn.textContent = 'VALIDER';
    }
  }

  function ajouterBoutonFlottant() {
    if (document.getElementById('rio-btn')) return;
    var btn = document.createElement('button');
    btn.id = 'rio-btn';
    btn.textContent = 'VALIDER';
    btn.style.cssText = 'position:fixed;bottom:30px;right:16px;z-index:99999;background:#E8460A;color:white;border:none;border-radius:50px;padding:16px 28px;font-size:16px;font-weight:800;font-family:system-ui,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,0.4);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;';
    btn.addEventListener('touchstart', function(e){ e.preventDefault(); cliquerActif(); }, {passive:false});
    btn.addEventListener('click', cliquerActif);
    document.body.appendChild(btn);
    mettreAJourLibelle();
  }

  function cliquerActif() {
    var clique = cliquerBouton('madiv_compris') || cliquerBouton('madiv_compris_2') || cliquerBouton('madiv_compris_3');
    if (clique) {
      var tries = 0;
      var t = setInterval(function() {
        tries++;
        if (cliquerBouton('madiv')) {
          clearInterval(t);
          setTimeout(etape3, 1000);
        }
        if (tries > 15) { clearInterval(t); setTimeout(etape3, 500); }
      }, 300);
      return;
    }
    if (cliquerBouton('madiv')) { setTimeout(etape3, 1000); return; }
    if (cliquerBouton('envoyer3')) return;
    var form = document.querySelector('form');
    if (form) form.submit();
  }

  // ── Lancement ────────────────────────────────────────────
  function init() {
    // Avec #jl= : flux automatique complet
    if (d && document.querySelector('select')) {
      etape1();
    } else {
      // Sans #jl= (ancien client) : juste le bouton flottant
      ajouterBoutonFlottant();
    }
  }

  if (document.readyState === 'complete') { setTimeout(init, 1000); }
  else { window.addEventListener('load', function(){ setTimeout(init, 1000); }); }

})();
`;
}

function copyStayScript() {
  const script = buildStayScript();
  navigator.clipboard.writeText(script).then(() => {
    const btn = document.getElementById('btn-copy-stay');
    btn.textContent = '✅ COPIÉ !';
    btn.style.background = 'var(--green)';
    setTimeout(() => {
      btn.textContent = '📋 COPIER LE SCRIPT STAY';
      btn.style.background = 'var(--orange)';
    }, 2000);
    showToast('✅ Script Stay copié !');
  });
}

function closeModal() {
  const modal = document.getElementById('modal-script');
  if (modal) modal.style.display = 'none';
}

function copyScript() {
  const script = buildScript();
  navigator.clipboard.writeText(script).then(() => {
    const btn = document.getElementById('btn-copy-script');
    if (btn) {
      btn.textContent = '✅ COPIÉ !';
      btn.style.background = 'var(--green)';
      setTimeout(() => {
        btn.textContent = '📋 COPIER LE SCRIPT';
        btn.style.background = 'var(--orange)';
      }, 2000);
    }
    showToast('✅ Script copié ! Colle-le dans la console JLAssure');
  }).catch(() => {
    // Fallback sélection manuelle
    const el = document.getElementById('script-preview');
    const range = document.createRange();
    range.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    showToast('📋 Texte sélectionné — Ctrl+C pour copier');
  });
}

// Fermer modal si clic hors
document.addEventListener('click', function(e) {
  const modal = document.getElementById('modal-script');
  if (modal && e.target === modal) closeModal();
});

// ============================================================
// HELPERS
// ============================================================
function formatDateJL(date) {
  if (!date || date === 'NON TROUVE') return '';
  return date.replace(/\//g, '-');
}

function getCurrentTime() {
  const now = new Date();
  return String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}

function addZero(tel) {
  if (!tel) return '';
  tel = tel.toString().replace(/\s/g, '');
  if (tel.charAt(0) !== '0') tel = '0' + tel;
  return tel;
}
